<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%" style="background-color:#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="425" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">The three losses of the World Model</text>

  <g transform="translate(35,72)">
    <rect x="0" y="0" width="250" height="150" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2.5"></rect>
    <rect x="20" y="22" width="42" height="30" rx="8" fill="#475569"></rect>
    <text x="41" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1.0</text>
    <text x="74" y="43" font-size="16" font-weight="700" fill="#0f172a">Prediction</text>
    <text x="20" y="82" font-size="13" font-weight="500" fill="#334155">Redraw the frame, plus</text>
    <text x="20" y="102" font-size="13" font-weight="500" fill="#334155">reward and continuation.</text>
    <text x="20" y="128" font-size="12" font-weight="600" fill="#64748b">Keeps sₜ faithful.</text>
  </g>

  <g transform="translate(300,72)">
    <rect x="0" y="0" width="250" height="150" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"></rect>
    <rect x="20" y="22" width="42" height="30" rx="8" fill="#8b5cf6"></rect>
    <text x="41" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1.0</text>
    <text x="74" y="43" font-size="16" font-weight="700" fill="#0f172a">Dynamics</text>
    <text x="20" y="82" font-size="13" font-weight="500" fill="#334155">Move the prior toward</text>
    <text x="20" y="102" font-size="13" font-weight="500" fill="#334155">the frozen posterior.</text>
    <text x="20" y="128" font-size="12" font-weight="600" fill="#6d28d9">Enables imagination.</text>
  </g>

  <g transform="translate(565,72)">
    <rect x="0" y="0" width="250" height="150" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2.5"></rect>
    <rect x="20" y="22" width="42" height="30" rx="8" fill="#a78bfa"></rect>
    <text x="41" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">0.1</text>
    <text x="74" y="43" font-size="16" font-weight="700" fill="#0f172a">Representation</text>
    <text x="20" y="82" font-size="13" font-weight="500" fill="#334155">The same KL, this time</text>
    <text x="20" y="102" font-size="13" font-weight="500" fill="#334155">with the prior frozen.</text>
    <text x="20" y="128" font-size="12" font-weight="600" fill="#6d28d9">Keeps zₜ predictable.</text>
  </g>

  <text x="425" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">ℒ = 1.0 · prediction + 1.0 · dynamics + 0.1 · representation</text>
  <line x1="180" y1="296" x2="670" y2="296" stroke="#cbd5e1" stroke-width="2"></line>
</svg>