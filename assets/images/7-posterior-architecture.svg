      <rect x="22.5" y="0" width="22.5" height="22.5" fill="#000000"></rect>
      <rect x="67.5" y="22.5" width="22.5" height="22.5" fill="#000000"></rect>
      <rect x="0" y="45" width="22.5" height="22.5" fill="#000000"></rect>
