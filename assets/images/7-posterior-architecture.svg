<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 505" width="100%" height="100%" style="background-color:#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"></feDropShadow>
    </filter>
    <filter id="subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.05"></feDropShadow>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2b7de9"></path></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"></path></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#20b2aa"></path></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"></path></marker>
  </defs>

  <text x="425" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Posterior Architecture: q(zₜ | hₜ, xₜ)</text>

  <rect x="35" y="60" width="780" height="425" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"></rect>

  
  <g transform="translate(70,305)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="140" rx="12" fill="#ffffff" stroke="#000000" stroke-width="2.5"></rect>
    <rect x="10" y="10" width="110" height="75" rx="6" fill="#1e293b"></rect>
    <rect x="20" y="20" width="90" height="8" fill="#ef4444" rx="1"></rect>
    <rect x="20" y="30" width="90" height="8" fill="#f59e0b" rx="1"></rect>
    <rect x="20" y="40" width="90" height="8" fill="#10b981" rx="1"></rect>
    <circle cx="60" cy="62" r="4" fill="#ffffff"></circle>
