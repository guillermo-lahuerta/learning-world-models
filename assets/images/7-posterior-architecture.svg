    <text x="65" y="126" text-anchor="middle" font-size="11" fill="#64748b">(Image / Vector)</text>
  </g>
  <path d="M 135,305 L 135,252" fill="none" stroke="#2b7de9" stroke-width="3" marker-end="url(#ab)"></path>

  
  <g transform="translate(60,175)" filter="url(#shadow)">
    <polygon points="0,70 150,70 126,0 24,0" fill="#2b7de9" stroke="#1d4ed8" stroke-width="2"></polygon>
    <text x="75" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">encoder</text>
    <text x="75" y="55" text-anchor="middle" font-size="11" font-weight="500" fill="#dbeafe">CNN / MLP</text>
  </g>
  <path d="M 135,175 L 135,130 Q 135,115 150,115 L 248,115" fill="none" stroke="#2b7de9" stroke-width="3" marker-end="url(#ab)"></path>
  <text x="158" y="106" font-size="12" font-weight="700" fill="#2b7de9">eₜ</text>

  
  <g transform="translate(250,200)" filter="url(#shadow)">
