      <rect x="22.5" y="67.5" width="22.5" height="22.5" fill="#dbeafe"></rect>
      <rect x="45" y="67.5" width="22.5" height="22.5" fill="#1d4ed8"></rect>
      <rect x="67.5" y="67.5" width="22.5" height="22.5" fill="#eff6ff"></rect>
      <rect x="0" y="0" width="90" height="90" fill="none" stroke="#000000" stroke-width="2"></rect>
      <line x1="22.5" y1="0" x2="22.5" y2="90" stroke="#000" stroke-width="1"></line>
      <line x1="45" y1="0" x2="45" y2="90" stroke="#000" stroke-width="1"></line>
      <line x1="67.5" y1="0" x2="67.5" y2="90" stroke="#000" stroke-width="1"></line>
      <line x1="0" y1="22.5" x2="90" y2="22.5" stroke="#000" stroke-width="1"></line>
      <line x1="0" y1="45" x2="90" y2="45" stroke="#000" stroke-width="1"></line>
      <line x1="0" y1="67.5" x2="90" y2="67.5" stroke="#000" stroke-width="1"></line>
    </g>
    <text x="72" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">D values</text>
    <text x="14" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b" transform="rotate(-90 14 101)">C variables</text>
    <text x="72" y="179" text-anchor="middle" font-size="10.5" font-weight="500" fill="#475569">Each row sums to 1</text>
  </g>

  
  <path d="M 596,336 L 658,336" fill="none" stroke="#0f172a" stroke-width="3" marker-end="url(#ad)"></path>
  <text x="627" y="322" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">sample</text>
  <text x="627" y="356" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">one per row</text>

  
  <g transform="translate(665,242)" filter="url(#shadow)">
