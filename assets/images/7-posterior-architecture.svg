    <text x="90" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Matrix of logits Lₜ</text>
    <text x="90" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Shape: C × D</text>
